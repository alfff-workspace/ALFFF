<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
:root{--bg:#14080f;--panel:#221019;--line:#43202f;--a:#ff6b4a;--b:#ffc24a;--text:#fff3ee;--mute:#b39a9f;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#050308;color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
button{font-family:inherit}
.app{position:relative;width:100%;max-width:480px;height:100%;max-height:860px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;transition:background .6s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(min-width:560px){.app{border-radius:36px;height:94%;border:1px solid var(--line);box-shadow:0 0 80px color-mix(in srgb,var(--a) 22%,transparent)}}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.dot{position:absolute;border-radius:50%;animation:drift var(--d) ease-in-out infinite alternate}
@keyframes drift{from{opacity:.15;transform:translate(0,0)}to{opacity:.9;transform:translate(24px,-50px)}}
.blob{position:absolute;border-radius:50%;opacity:.15;filter:blur(8px);animation:blob var(--d) ease-in-out infinite alternate}
@keyframes blob{from{transform:translate(-30px,0) scale(.9)}to{transform:translate(50px,70px) scale(1.3)}}
.scan{position:absolute;left:0;right:0;height:2px;background:var(--b);opacity:.2;animation:scan 5s linear infinite}
@keyframes scan{from{top:0}to{top:100%}}
header{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:18px;cursor:pointer;transition:transform .25s,border-color .25s;display:grid;place-items:center}
.ib:hover{border-color:var(--a);transform:translateY(-2px)}.ib:active{transform:scale(.88)}
.logo{display:flex;align-items:center;font-size:26px;font-weight:900;letter-spacing:2px}
.gl{position:relative;background:linear-gradient(90deg,var(--a),var(--b),var(--a));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.gl::after{content:attr(data-t);position:absolute;left:0;color:var(--b);-webkit-text-fill-color:var(--b);opacity:0;animation:glitch 3.4s infinite}
@keyframes glitch{0%,86%,100%{opacity:0;transform:none}88%{opacity:.9;transform:translateX(4px)}90%{opacity:0}92%{opacity:.9;transform:translateX(-3px)}95%{opacity:0}}
.pulse{position:relative;width:8px;height:8px;border-radius:50%;background:var(--a);margin-left:12px}
.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--a);animation:ping 1.6s ease-out infinite}
@keyframes ping{from{opacity:.6;transform:scale(1)}to{opacity:0;transform:scale(4)}}
main{position:relative;z-index:1;flex:1;overflow-y:auto;padding:8px 18px 18px}
.big{display:flex;font-size:84px;font-weight:900;line-height:1;letter-spacing:2px}
.big span{display:inline-block;opacity:0;color:var(--a);animation:pop .7s cubic-bezier(.34,1.56,.64,1) forwards,float 2.8s ease-in-out infinite}
.big span:nth-child(even){color:var(--b)}
@keyframes pop{from{opacity:0;transform:translateY(50px) scale(.5) rotate(-10deg)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.fade{opacity:0;animation:fade .55s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fade{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
.row{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:15px}
.tag{background:linear-gradient(135deg,var(--a),var(--b));color:var(--bg);font-weight:900;font-size:18px;padding:3px 14px;border-radius:999px}
.intro{color:var(--mute);font-size:15px;line-height:1.5;margin:16px 0;min-height:46px}
.cur{color:var(--b);animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:0}}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid var(--a);background:color-mix(in srgb,var(--a) 10%,transparent);color:var(--text);font-size:14px;padding:10px 16px;border-radius:999px;cursor:pointer;transition:transform .2s,background .2s}
.chip:hover{transform:translateY(-3px);background:var(--a);color:var(--bg)}.chip:active{transform:scale(.93)}
.orbit{position:relative;width:120px;height:120px;margin:36px auto 0}
.orbit i{position:absolute;border-radius:50%}
.orbit i:nth-child(1){inset:0;border:2px dashed var(--a);animation:spin 9s linear infinite}
.orbit i:nth-child(2){inset:22px;border:2px solid var(--b);animation:spin 7s linear infinite reverse}
.orbit i::before{content:"";position:absolute;top:-6px;left:calc(50% - 6px);width:12px;height:12px;border-radius:50%;background:var(--b)}
.orbit i:nth-child(2)::before{background:var(--a)}
@keyframes spin{to{transform:rotate(360deg)}}
.msgs{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.m{max-width:86%;padding:12px 16px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;animation:fromr .45s cubic-bezier(.2,.9,.3,1.2) both;cursor:default}
.me{align-self:flex-end;background:linear-gradient(135deg,var(--a),var(--b));color:var(--bg);font-weight:500;border-radius:22px 22px 6px 22px}
.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:22px 22px 22px 6px;animation-name:froml;cursor:pointer}
@keyframes fromr{from{opacity:0;transform:translateX(40px) scale(.9)}to{opacity:1;transform:none}}
@keyframes froml{from{opacity:0;transform:translateX(-40px) scale(.9)}to{opacity:1;transform:none}}
.typing{display:flex;gap:6px;padding:16px 18px}
.typing i{width:9px;height:9px;border-radius:50%;background:var(--a);animation:bounce .9s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.15s;background:var(--b)}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{opacity:.35;transform:none}40%{opacity:1;transform:translateY(-7px)}}
.err{align-self:stretch;border:1px solid var(--a);border-radius:18px;padding:12px 16px;font-size:13px;display:flex;gap:12px;justify-content:space-between;align-items:center;animation:fade .4s both}

@keyframes glow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--a) 55%,transparent)}50%{box-shadow:0 0 0 10px transparent}}

#drawer{position:absolute;top:0;bottom:0;left:0;width:84%;max-width:340px;z-index:11;background:var(--bg);border-right:1px solid var(--line);border-radius:0 32px 32px 0;transform:translateX(-105%);transition:transform .4s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 14px 14px}

.pill.ghost{background:none;border:1px solid var(--line);color:var(--text)}
.modal{position:absolute;left:16px;right:16px;top:50%;z-index:12;background:var(--bg);border:1px solid var(--line);border-radius:30px;padding:22px;transform:translateY(-40%) scale(.9);opacity:0;pointer-events:none;transition:transform .4s cubic-bezier(.2,.9,.3,1.2),opacity .3s;max-height:90%;overflow-y:auto}
.modal.on{transform:translateY(-50%);opacity:1;pointer-events:auto}
.modal h3{margin:0 0 6px;font-size:22px;font-weight:900;color:var(--a);letter-spacing:2px}

.modal input:focus{border-color:var(--a)}
.sw{display:flex;gap:12px;margin:14px 0 4px}

.cc:hover{border-color:var(--a);transform:translateY(-2px)}.cc:active{transform:scale(.93)}
#mic.on{border-color:var(--a);background:var(--a);color:var(--bg);animation:micp 1.1s ease-out infinite}
@keyframes micp{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--a) 60%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.acts{align-self:flex-start;display:flex;gap:6px;margin:-6px 0 0 6px}
.acts button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:14px;transition:transform .2s,border-color .2s}
.acts button:hover{transform:scale(1.15);border-color:var(--a)}
.pic{display:block;max-width:180px;border-radius:14px;margin-bottom:8px}
#vo{position:absolute;inset:0;z-index:15;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;opacity:0;pointer-events:none;transition:opacity .4s}

.orb.listen{animation:breathe 1.6s ease-in-out infinite}.orb.listen i{animation:ring 2s ease-out infinite}
.orb.listen i:nth-child(2){animation-delay:.6s}.orb.listen i:nth-child(3){animation-delay:1.2s}
@keyframes ring{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(2.3)}}

#vst{font-size:20px;font-weight:900;letter-spacing:.12em;color:var(--a)}

.set input[type=range]{padding:0;border:0;background:none;accent-color:var(--a);margin-top:8px}

@media(max-width:340px){.ib{width:38px;height:38px;font-size:16px}.send{width:44px;height:44px}form,#ctl{padding-left:8px;padding-right:8px}form{gap:6px}textarea{padding:12px 14px;font-size:15px}main{padding:8px 12px 14px}}

<body>
<div class="app" id="app">
  <div id="fx"></div>
  <header>
    <button class="ib rip" id="menuBtn" aria-label="Chats">☰</button>
    <div class="logo"><span class="gl" data-t="ALFFF">ALFFF</span><span class="pulse"></span></div>
    <div style="display:flex;gap:8px"><button class="ib rip" id="themeBtn" aria-label="Change theme">🎨</button><button class="ib rip" id="setBtn" aria-label="Settings">⚙</button></div>
  </header>
  <main id="main"></main>
  <div id="ctl"></div>
  <form id="f">
    <button class="ib rip" id="clip" type="button" aria-label="Attach image">📎</button><input type="file" id="file" accept="image/*" hidden>
    <textarea id="t" rows="1" placeholder="Message ALFFF…"></textarea>
    <button class="ib rip" id="mic" type="button" aria-label="Dictate">🎤</button>

  </form>
  <div class="ov" id="ov"></div>
  <aside id="drawer">
    <h3>CHATS</h3>
    <div id="list"></div>
    <button class="pill rip" id="newBtn">＋ NEW CHAT</button>
  </aside>
  <div class="modal" id="modal">
    <h3>SETTINGS</h3>
    <p><b>Free mode:</b> tap the button once to sign in to a free Puter account. No key needed. Free allowances have limits, and your messages go through Puter. <b>Or</b> paste your own key below: a Claude key (starts with sk-ant) or a Gemini key (any other key is used as Gemini).</p>
    <button class="pill rip" type="button" id="puterBtn" style="width:100%;margin:0 0 12px">SIGN IN TO FREE MODE</button>
    <input id="keyIn" type="password" placeholder="Gemini or Claude API key (optional)" autocomplete="off">
    <div class="sw" id="sw"></div>
    <div class="set">
      <label>Personality<select id="pSel"></select></label>
      <label>Speech language<select id="lSel"></select></label>
      <label>Voice<select id="vSel"></select></label>
      <label>Speaking speed <b id="rv">1.0×</b><input id="rate" type="range" min="0.6" max="1.6" step="0.1"></label>
      <label class="chk"><input type="checkbox" id="auto"> Read every reply aloud</label>
      <button class="pill ghost rip" style="width:100%" type="button" id="expBtn">EXPORT THIS CHAT</button>
    </div>
    <button class="pill rip" style="width:100%" id="saveBtn">SAVE</button>
    <button class="pill ghost" style="width:100%" id="wipeBtn">DELETE ALL CHATS</button>
  </div>
  <div id="vo"><button class="ib rip" id="voX" aria-label="Close voice mode">✕</button><div class="orb listen" id="orb"><i></i><i></i><i></i></div><div id="vst">LISTENING…</div><div id="vtx"></div><button class="pill rip" id="voStop" style="padding:14px 38px">END VOICE MODE</button></div>
  <div id="toast"></div>
</div>
<script>
(function(){
var MODEL='claude-sonnet-5-5';
var SYS='You are ALFFF, a friendly, sharp, concise AI assistant with a bold, confident personality. Keep answers clear and useful, short by default. Plain text, no markdown headings.';
var THEMES=[
 {n:'Sunset',bg:'#14080f',panel:'#221019',line:'#43202f',a:'#ff6b4a',b:'#ffc24a',text:'#fff3ee',mute:'#b39a9f'},
 {n:'Neon',bg:'#05051a',panel:'#0e0e2a',line:'#24235a',a:'#8b5cf6',b:'#22d3ee',text:'#eef2ff',mute:'#8b8fb8'},
 {n:'Mint',bg:'#06130f',panel:'#0c211b',line:'#1a4034',a:'#2dd4a0',b:'#a3e635',text:'#ecfdf5',mute:'#8fb3a5'},
 {n:'Ocean',bg:'#04101c',panel:'#0a1d30',line:'#163a5c',a:'#38bdf8',b:'#818cf8',text:'#eff8ff',mute:'#8aa6bf'},
 {n:'Candy',bg:'#170a18',panel:'#26112a',line:'#4a2150',a:'#f472b6',b:'#fde047',text:'#fff1fb',mute:'#b898b8'}];
var $=function(i){return document.getElementById(i)};
var S={get:function(k,d){try{var v=localStorage.getItem('alfff.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem('alfff.'+k,JSON.stringify(v))}catch(e){}}};
var key=S.get('key',''),chats=S.get('chats',[]),activeId=S.get('active',null),ti=S.get('theme',0),busy=false,lastErr=null;
var main=$('main'),t=$('t'),b=$('b');

function theme(i){ti=i%THEMES.length;var T=THEMES[ti],r=document.documentElement.style;
  ['bg','panel','line','a','b','text','mute'].forEach(function(k){r.setProperty('--'+k,T[k])});
  document.querySelector('meta[name=theme-color]').content=T.bg;S.set('theme',ti);
  [].forEach.call($('sw').children,function(x,j){x.classList.toggle('on',j===ti)});
  [].forEach.call(document.querySelectorAll('.dot'),function(d,j){d.style.background=j%3===0?T.b:T.a});
  [].forEach.call(document.querySelectorAll('.blob'),function(d,j){d.style.background=j?T.b:T.a});}
THEMES.forEach(function(T,i){var x=document.createElement('button');x.title=T.n;x.style.background='linear-gradient(135deg,'+T.a+','+T.b+')';x.onclick=function(){theme(i)};$('sw').appendChild(x)});

// background fx
var fx=$('fx');
for(var i=0;i<26;i++){var d=document.createElement('div');d.className='dot';var r=2+Math.random()*3;d.style.cssText='left:'+Math.random()*96+'%;top:'+Math.random()*92+'%;width:'+r*2+'px;height:'+r*2+'px;--d:'+(4+Math.random()*5)+'s';fx.appendChild(d)}
[[300,'-5%','-30%',7],[260,'55%','45%',9]].forEach(function(o){var z=document.createElement('div');z.className='blob';z.style.cssText='width:'+o[0]+'px;height:'+o[0]+'px;top:'+o[1]+';left:'+o[2]+';--d:'+o[3]+'s';fx.appendChild(z)});
var sc=document.createElement('div');sc.className='scan';fx.appendChild(sc);
theme(ti);

// cursor sparks + ripples
var lastS=0;
document.addEventListener('pointermove',function(e){var n=Date.now();if(n-lastS<45)return;lastS=n;var s=document.createElement('div');s.className='spark';var T=THEMES[ti];
  s.style.cssText='left:'+e.clientX+'px;top:'+e.clientY+'px;background:'+(Math.random()<.5?T.a:T.b)+';--x:'+(Math.random()*40-20)+'px;--y:'+(Math.random()*40-10)+'px';document.body.appendChild(s);setTimeout(function(){s.remove()},800)});
document.addEventListener('pointerdown',function(e){var el=e.target.closest&&e.target.closest('.rip');if(!el)return;var rc=el.getBoundingClientRect(),z=Math.max(rc.width,rc.height),p=document.createElement('span');p.className='ripple';
  p.style.cssText='width:'+z+'px;height:'+z+'px;left:'+(e.clientX-rc.left-z/2)+'px;top:'+(e.clientY-rc.top-z/2)+'px';el.appendChild(p);setTimeout(function(){p.remove()},600)});

function toast(m){var x=$('toast');x.textContent=m;x.classList.add('on');setTimeout(function(){x.classList.remove('on')},1400)}
function save(){S.set('chats',chats.map(function(c){return {id:c.id,title:c.title,msgs:c.msgs.map(function(m){return {role:m.role,content:m.content}})}}));S.set('active',activeId)}
function cur(){var c=chats.filter(function(x){return x.id===activeId})[0];if(!c){c=chats[0]}if(!c){c={id:Math.random().toString(36).slice(2),title:'New chat',msgs:[]};chats.unshift(c)}activeId=c.id;return c}

function intro(){
  main.innerHTML='';var big=document.createElement('div');big.className='big';
  'ALFFF'.split('').forEach(function(c,i){var s=document.createElement('span');s.textContent=c;s.style.animationDelay=i*110+'ms,'+(1300+i*160)+'ms';big.appendChild(s)});main.appendChild(big);
  main.insertAdjacentHTML('beforeend','<div class="row fade" style="animation-delay:700ms"><span>Hello, I’m</span><span class="tag">ALFFF.</span></div><p class="intro"><span id="tw"></span><span class="cur">▍</span></p>');
  var ch=document.createElement('div');ch.className='chips';
  ['Help me plan my day','Explain something simply','Brainstorm app ideas','Write a message for me'].forEach(function(q,i){var c=document.createElement('button');c.className='chip rip fade';c.style.animationDelay=1150+i*130+'ms';c.textContent=q;c.onclick=function(){send(q)};ch.appendChild(c)});
  main.appendChild(ch);main.insertAdjacentHTML('beforeend','<div class="orbit fade" style="animation-delay:1700ms"><i></i><i></i></div>');
  var msg='Ask me anything. Pick a starter or type your own.',k=0;clearInterval(window._tw);
  setTimeout(function(){window._tw=setInterval(function(){var e=$('tw');if(!e||k>=msg.length){clearInterval(window._tw);return}e.textContent=msg.slice(0,++k)},35)},1000)}
function bubble(role,text,img){var ms=$('ms');if(!ms){main.innerHTML='<div class="msgs" id="ms"></div>';ms=$('ms')}
  var d=document.createElement('div');d.className='m '+(role==='user'?'me':'bot');d.textContent=text;if(img){var im=document.createElement('img');im.src=img;im.className='pic';d.insertBefore(im,d.firstChild)}
  if(role!=='user')d.onclick=function(){try{navigator.clipboard.writeText(d.textContent);toast('Copied')}catch(e){}};
  ms.appendChild(d);
  if(role!=='user'){var a=document.createElement('div');a.className='acts';a.innerHTML='<button title="Read aloud">🔊</button><button title="Copy">📋</button>';a.children[0].onclick=function(){if(synth&&synth.speaking){speakTok++;synth.cancel();return}speak(d.textContent)};a.children[1].onclick=function(){try{navigator.clipboard.writeText(d.textContent);toast('Copied')}catch(e){}};ms.appendChild(a)}
  main.scrollTop=main.scrollHeight;return d}
function render(){ctl();var c=cur();if(!c.msgs.length){intro();return}main.innerHTML='<div class="msgs" id="ms"></div>';c.msgs.forEach(function(m){bubble(m.role,m.content)})}
function list(){var l=$('list');l.innerHTML='';chats.forEach(function(c,i){var x=document.createElement('div');x.className='chat'+(c.id===activeId?' cur2':'');x.style.animationDelay=i*60+'ms';
  x.innerHTML='<span></span><button aria-label="Delete">✕</button>';x.firstChild.textContent=c.title;
  x.onclick=function(){activeId=c.id;save();close();render()};
  x.lastChild.onclick=function(e){e.stopPropagation();chats=chats.filter(function(z){return z!==c});if(activeId===c.id)activeId=null;save();cur();list();render()};l.appendChild(x)})}
function open(el){$('ov').classList.add('on');el.classList.add('on')}
function close(){['drawer','modal','ov'].forEach(function(i){$(i).classList.remove('on')})}
function newChat(){var c=cur();if(!c.msgs.length){close();return}c={id:Math.random().toString(36).slice(2),title:'New chat',msgs:[]};chats.unshift(c);activeId=c.id;save();close();render()}

async function ask(c){if(!key)return askFree(c);if(!/^sk-ant/.test(key))return askGemini(c);
  busy=true;b.disabled=true;lastErr=null;lastReply='';ctl();
  var ty=document.createElement('div');ty.className='m bot typing';ty.innerHTML='<i></i><i></i><i></i>';$('ms').appendChild(ty);main.scrollTop=main.scrollHeight;
  var el=null,full='';
  try{
    var res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:(abortC=new AbortController()).signal,headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:MODEL,max_tokens:1024,stream:true,system:SYS+PERSONAS[V.persona||0].p+(voiceOn?' You are in a spoken conversation: reply in 1-3 short sentences, plain words, no lists or symbols.':''),messages:apiMsgs(c)})});
    if(!res.ok){var m='Error '+res.status;try{var j=await res.json();m=(j.error&&j.error.message)||m}catch(e){}throw new Error(res.status===401?'That API key was rejected. Check it in Settings.':m)}
    var rd=res.body.getReader(),dec=new TextDecoder(),buf='';
    for(;;){var r=await rd.read();if(r.done)break;buf+=dec.decode(r.value,{stream:true});var lines=buf.split('\n');buf=lines.pop();
      for(var i=0;i<lines.length;i++){var ln=lines[i];if(ln.indexOf('data:')!==0)continue;
        try{var ev=JSON.parse(ln.slice(5));if(ev.type==='content_block_delta'&&ev.delta&&ev.delta.type==='text_delta'){if(!el){ty.remove();el=bubble('assistant','')}full+=ev.delta.text;el.textContent=full;main.scrollTop=main.scrollHeight}}catch(e){}}}
    if(!full)throw new Error('Empty reply. Try again.');
    c.msgs.push({role:'assistant',content:full});save();lastReply=full;if(V.auto&&!voiceOn)speak(full);
  }catch(e){
    ty.remove();if(full){c.msgs.push({role:'assistant',content:full});save()}
    if(e.name==='AbortError'){busy=false;b.disabled=false;ctl();return}
    var msg=/Failed to fetch|Load failed|NetworkError/i.test(e.message)?'Can’t reach Claude. Check your internet connection.':e.message;
    var er=document.createElement('div');er.className='err';er.innerHTML='<span></span><button>RETRY</button>';er.firstChild.textContent=msg;
    er.lastChild.onclick=function(){er.remove();if(c.msgs.length&&c.msgs[c.msgs.length-1].role==='user')ask(c)};$('ms').appendChild(er);main.scrollTop=main.scrollHeight}
  busy=false;b.disabled=false;ctl()}
var GMODELS=['gemini-2.5-flash','gemini-3-flash-preview','gemini-3.5-flash'];
async function askGemini(c){
  busy=true;b.disabled=true;lastErr=null;lastReply='';ctl();
  var ty=document.createElement('div');ty.className='m bot typing';ty.innerHTML='<i></i><i></i><i></i>';$('ms').appendChild(ty);main.scrollTop=main.scrollHeight;
  var full='',userAbort=new AbortController(),log=[];abortC=userAbort;
  var sys=SYS+PERSONAS[V.persona||0].p+(voiceOn?' You are in a spoken conversation: reply in 1-3 short sentences, plain words, no lists or symbols.':'');
  var contents=c.msgs.slice(-40).map(function(m){var p=[{text:m.content}];if(m.img)p.unshift({inline_data:{mime_type:'image/jpeg',data:m.img.split(',')[1]}});return {role:m.role==='assistant'?'model':'user',parts:p}});
  try{
    for(var k=0;k<GMODELS.length&&!full&&!userAbort.signal.aborted;k++){
      var ctrl=new AbortController(),timer=setTimeout(function(){ctrl.abort()},25000);
      userAbort.signal.addEventListener('abort',function(){ctrl.abort()});
      try{
        var r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+GMODELS[k]+':generateContent',{method:'POST',signal:ctrl.signal,headers:{'content-type':'application/json','x-goog-api-key':key},body:JSON.stringify({system_instruction:{parts:[{text:sys}]},contents:contents})});
        clearTimeout(timer);
        var j=null;try{j=await r.json()}catch(e){}
        if(!r.ok){
          var em=((j&&j.error&&j.error.message)||('Error '+r.status)).slice(0,220);
          if(r.status===429)throw new Error('Gemini free limit reached for now. Wait a bit, then try again.');
          if((r.status===400||r.status===401||r.status===403)&&/api key|permission|credential|not valid|unauthenticated|not supported/i.test(em))throw new Error('Google rejected the key: '+em);
          log.push(GMODELS[k]+': '+r.status+' '+em);continue}
        var parts=j&&j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts;
        if(parts)parts.forEach(function(pt){if(pt.text&&!pt.thought)full+=pt.text});
        if(!full)log.push(GMODELS[k]+': empty reply'+(j&&j.promptFeedback?' (blocked)':''));
      }catch(e){
        clearTimeout(timer);if(userAbort.signal.aborted)break;
        if(/free limit|rejected the key/.test(e.message||''))throw e;
        log.push(GMODELS[k]+': '+(e.name==='AbortError'?'no answer after 25 seconds':(/Failed to fetch|Load failed|NetworkError/i.test(e.message||'')?'could not connect':e.message)))}
    }
    if(userAbort.signal.aborted){ty.remove();busy=false;b.disabled=false;ctl();return}
    if(!full)throw new Error('Gemini did not answer. '+log.join(' | '));
    ty.remove();var el=bubble('assistant','');
    for(var i=1;i<=full.length&&!userAbort.signal.aborted;i+=3){el.textContent=full.slice(0,i);main.scrollTop=main.scrollHeight;await new Promise(function(z){setTimeout(z,14)})}
    if(!userAbort.signal.aborted)el.textContent=full;else full=el.textContent;
    c.msgs.push({role:'assistant',content:full});save();lastReply=full;if(V.auto&&!voiceOn)speak(full);
  }catch(e){
    ty.remove();
    var er=document.createElement('div');er.className='err';er.innerHTML='<span></span><button>RETRY</button>';er.firstChild.textContent=e.message;
    er.lastChild.onclick=function(){er.remove();if(c.msgs.length&&c.msgs[c.msgs.length-1].role==='user')ask(c)};$('ms').appendChild(er);main.scrollTop=main.scrollHeight}
  busy=false;b.disabled=false;ctl()}
var PMODELS=['anthropic/claude-sonnet-5-5','claude-sonnet-4-6'];
async function askFree(c){
  busy=true;b.disabled=true;lastErr=null;lastReply='';ctl();
  var ty=document.createElement('div');ty.className='m bot typing';ty.innerHTML='<i></i><i></i><i></i>';$('ms').appendChild(ty);main.scrollTop=main.scrollHeight;
  var el=null,full='',stopped=false;abortC={abort:function(){stopped=true}};
  var last=c.msgs[c.msgs.length-1];if(last&&last.img)toast('Photos only work with your own Claude key');
  var sys=SYS+PERSONAS[V.persona||0].p+(voiceOn?' You are in a spoken conversation: reply in 1-3 short sentences, plain words, no lists or symbols.':'');
  var msgs=[{role:'system',content:sys}].concat(c.msgs.slice(-40).map(function(m){return {role:m.role,content:m.content}}));
  try{
    if(typeof puter==='undefined')throw new Error('Free mode could not load. Check your internet connection.');
    var resp=null,lastE=null;
    for(var k=0;k<PMODELS.length&&!resp;k++){try{resp=await puter.ai.chat(msgs,{model:PMODELS[k],stream:true})}catch(e){lastE=e}}
    if(!resp)throw lastE||new Error('No answer. Try again.');
    for await(var part of resp){if(stopped)break;var tx=part&&part.text;if(tx){if(!el){ty.remove();el=bubble('assistant','')}full+=tx;el.textContent=full;main.scrollTop=main.scrollHeight}}
    if(!full&&!stopped)throw new Error('Empty reply. Try again.');
    ty.remove();if(full){c.msgs.push({role:'assistant',content:full});save();lastReply=full;if(V.auto&&!voiceOn)speak(full)}
  }catch(e){
    ty.remove();if(full){c.msgs.push({role:'assistant',content:full});save()}
    var msg=(e&&e.message)||(typeof e==='string'?e:'')||'Something went wrong. You may need to sign in, or you reached the free limit.';
    if(/limit|quota|credit|allowance|insufficient/i.test(msg))msg='You reached the free limit. Try again later, or add your own Claude key in Settings.';
    else if(/auth|sign|login|token|401/i.test(msg))msg='Please sign in: tap the gear, then "Sign in to free mode".';
    var er=document.createElement('div');er.className='err';er.innerHTML='<span></span><button>RETRY</button>';er.firstChild.textContent=msg;
    er.lastChild.onclick=function(){er.remove();if(c.msgs.length&&c.msgs[c.msgs.length-1].role==='user')ask(c)};$('ms').appendChild(er);main.scrollTop=main.scrollHeight}
  busy=false;b.disabled=false;ctl()}
function send(raw){
  var text=(typeof raw==='string'?raw:t.value).trim();if(!text&&pend)text='Describe this image.';if(!text||busy)return;
  
  var c=cur();if(!c.msgs.length){c.title=text.slice(0,30);main.innerHTML='<div class="msgs" id="ms"></div>'}
  c.msgs.push({role:'user',content:text,img:pend});save();bubble('user',text,pend);pend=null;try{if(dictOn)dict.stop()}catch(e){}t.value='';t.style.height='auto';return ask(c)}


/* ===== voice, speech, images, extras ===== */
var synth=window.speechSynthesis,SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var V=S.get('voice',{}),lastReply='',abortC=null,voiceOn=false,speakTok=0,pend=null,rec=null,dict=null,dictOn=false,dictBase='';
var PERSONAS=[{n:'Assistant',p:''},{n:'Teacher',p:' Explain things step by step like a patient teacher, with simple examples.'},{n:'Coder',p:' You are an expert programmer. Give working code and brief explanations.'},{n:'Translator',p:' Translate whatever the user writes between English and their language, and explain nuances briefly.'},{n:'Funny friend',p:' Be witty and playful with light jokes, but still helpful.'},{n:'Coach',p:' Act as a motivating study and life coach: ask one good question, then give a concrete next step.'}];
var LANGS=[['en-US','English (US)'],['en-GB','English (UK)'],['en-IN','English (India)'],['hi-IN','Hindi'],['ur-PK','Urdu'],['bn-IN','Bengali'],['ar-SA','Arabic'],['es-ES','Spanish'],['fr-FR','French'],['de-DE','German'],['it-IT','Italian'],['pt-BR','Portuguese'],['ru-RU','Russian'],['tr-TR','Turkish'],['ja-JP','Japanese'],['ko-KR','Korean'],['zh-CN','Chinese']];
function sv(){S.set('voice',V)}
function apiMsgs(c){return c.msgs.slice(-40).map(function(m){if(!m.img)return {role:m.role,content:m.content};return {role:m.role,content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:m.img.split(',')[1]}},{type:'text',text:m.content}]}})}

// text to speech
function clean(s){return s.replace(/[*_`#>]/g,'').replace(/https?:\/\/\S+/g,'link')}
function speak(text,done){
  if(!synth){toast('Text to speech isn’t supported in this browser');done&&done();return}
  synth.cancel();var tok=++speakTok,parts=clean(text).match(/[^.!?\n]+[.!?]*/g)||[clean(text)],i=0,vo=synth.getVoices().filter(function(x){return x.name===V.voice})[0];
  (function next(){if(tok!==speakTok)return;if(i>=parts.length){done&&done();return}
    var u=new SpeechSynthesisUtterance(parts[i++].trim());if(!u.text){next();return}
    u.rate=V.rate||1;u.lang=V.lang||'en-US';if(vo){u.voice=vo;u.lang=vo.lang}
    u.onend=next;u.onerror=function(){if(tok===speakTok)done&&done()};synth.speak(u)})()}

// speech to text (dictation)
$('mic').onclick=function(){
  if(dictOn){dict.stop();return}
  if(!SR){toast('Speech to text needs Chrome, Edge or Safari');return}
  dict=new SR();dict.lang=V.lang||'en-US';dict.interimResults=true;dict.continuous=true;dictBase=t.value?t.value+' ':'';
  dict.onresult=function(e){var s='';for(var i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;t.value=dictBase+s;t.dispatchEvent(new Event('input'))};
  dict.onerror=function(e){if(e.error==='not-allowed'||e.error==='service-not-allowed')toast('Microphone blocked. Allow it in your browser.')};
  dict.onend=function(){dictOn=false;$('mic').classList.remove('on')};
  try{dict.start();dictOn=true;$('mic').classList.add('on')}catch(e){}};

// voice assistant (hands-free loop: listen -> think -> speak -> listen)
function vstate(s,txt){$('orb').className='orb '+s;$('vst').textContent={listen:'LISTENING…',think:'THINKING…',speak:'SPEAKING…'}[s];if(txt!=null)$('vtx').textContent=txt}
function vstart(){
  if(!SR){toast('Voice mode needs Chrome, Edge or Safari');return}
  
  if(dictOn)dict.stop();voiceOn=true;$('vo').classList.add('on');vloop()}
function vstop(){voiceOn=false;speakTok++;try{rec&&rec.abort()}catch(e){}if(synth)synth.cancel();if(abortC&&busy)abortC.abort();$('vo').classList.remove('on');ctl()}
function vloop(){
  if(!voiceOn)return;vstate('listen','');var got='';
  rec=new SR();rec.lang=V.lang||'en-US';rec.interimResults=true;rec.continuous=false;
  rec.onresult=function(e){var s='',f=false;for(var i=0;i<e.results.length;i++){s+=e.results[i][0].transcript;f=e.results[i].isFinal}$('vtx').textContent=s;if(f)got=s};
  rec.onerror=function(e){if(e.error==='not-allowed'||e.error==='service-not-allowed'){toast('Microphone blocked. Allow it in your browser.');vstop()}};
  rec.onend=async function(){
    if(!voiceOn)return;if(!got.trim()){setTimeout(vloop,300);return}
    vstate('think',got);lastReply='';await send(got);if(!voiceOn)return;
    if(lastReply){vstate('speak',lastReply);speak(lastReply,function(){if(voiceOn)vloop()})}else setTimeout(vloop,700)};
  try{rec.start()}catch(e){setTimeout(vloop,500)}}
$('voX').onclick=vstop;$('voStop').onclick=vstop;

// image attach
$('clip').onclick=function(){$('file').click()};
$('file').onchange=function(){var f=this.files[0];this.value='';if(!f)return;var rd=new FileReader();
  rd.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,1024/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);pend=cv.toDataURL('image/jpeg',.75);ctl();toast('Image ready. Ask about it!')};im.src=rd.result};rd.readAsDataURL(f)};

// quick controls: voice mode, stop, regenerate, image chip
function regen(){var c=cur();if(busy||!c.msgs.length)return;if(c.msgs[c.msgs.length-1].role==='assistant')c.msgs.pop();if(!c.msgs.length)return;save();render();ask(c)}
function ctl(){var c=cur(),h='<button class="cc rip" id="vBtn">🎧 Voice mode</button>';
  if(busy)h+='<button class="cc rip" id="stBtn">■ Stop</button>';
  else if(c.msgs.length&&c.msgs[c.msgs.length-1].role==='assistant')h+='<button class="cc rip" id="rgBtn">↻ Regenerate</button>';
  if(pend)h+='<button class="cc rip" id="imBtn">🖼 Image ✕</button>';
  $('ctl').innerHTML=h;$('vBtn').onclick=vstart;
  if($('stBtn'))$('stBtn').onclick=function(){if(abortC)abortC.abort()};
  if($('rgBtn'))$('rgBtn').onclick=regen;
  if($('imBtn'))$('imBtn').onclick=function(){pend=null;ctl()}}

// extra settings: personality, language, voice, speed, auto-read, export
function fillSet(){
  var p=$('pSel');p.innerHTML='';PERSONAS.forEach(function(x,i){p.appendChild(new Option(x.n,i))});p.value=V.persona||0;
  var l=$('lSel');l.innerHTML='';LANGS.forEach(function(x){l.appendChild(new Option(x[1],x[0]))});l.value=V.lang||'en-US';
  var v=$('vSel');v.innerHTML='';v.appendChild(new Option('Default voice',''));
  if(synth)synth.getVoices().filter(function(x){return x.lang.slice(0,2)===(V.lang||'en-US').slice(0,2)}).forEach(function(x){v.appendChild(new Option(x.name,x.name))});v.value=V.voice||'';
  $('rate').value=V.rate||1;$('rv').textContent=(V.rate||1).toFixed(1)+'×';$('auto').checked=!!V.auto}
if(synth)synth.onvoiceschanged=fillSet;
$('pSel').onchange=function(){V.persona=+this.value;sv();toast(PERSONAS[V.persona].n+' mode')};
$('lSel').onchange=function(){V.lang=this.value;V.voice='';sv();fillSet()};
$('vSel').onchange=function(){V.voice=this.value;sv();speak('Hi, I’m ALFFF.')};
$('rate').oninput=function(){V.rate=+this.value;$('rv').textContent=V.rate.toFixed(1)+'×';sv()};
$('rate').onchange=function(){speak('This is how fast I talk.')};
$('auto').onchange=function(){V.auto=this.checked;sv()};
$('expBtn').onclick=function(){var c=cur(),tx=c.title+'\n\n'+c.msgs.map(function(m){return (m.role==='user'?'You: ':'ALFFF: ')+m.content}).join('\n\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([tx],{type:'text/plain'}));a.download='ALFFF-chat.txt';a.click();toast('Chat exported')};

$('puterBtn').onclick=function(){try{puter.auth.signIn().then(function(){close();toast('Signed in. Free mode is ready!')}).catch(function(){toast('Sign-in cancelled')})}catch(e){toast('Could not load Puter. Check your internet.')}};
$('f').addEventListener('submit',function(e){e.preventDefault();send()});
t.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
t.addEventListener('input',function(){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,120)+'px'});
$('menuBtn').onclick=function(){list();open($('drawer'))};
$('setBtn').onclick=function(){$('keyIn').value=key;fillSet();open($('modal'))};
$('themeBtn').onclick=function(){theme(ti+1);toast(THEMES[ti].n+' theme')};
$('ov').onclick=close;$('newBtn').onclick=newChat;
$('saveBtn').onclick=function(){key=$('keyIn').value.trim();S.set('key',key);close();toast(key?(/^sk-ant/.test(key)?'Claude key saved':'Gemini key saved'):'Key removed')};
$('wipeBtn').onclick=function(){chats=[];activeId=null;save();cur();close();render();toast('Chats deleted')};
render();if(!key&&!S.get('seen',false)){S.set('seen',true);setTimeout(function(){open($('modal'))},900)}
})();
</script>
